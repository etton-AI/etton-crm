server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index monthly-public.html;

    # 静态资源不缓存：seed / js 更新后刷新即可生效
    add_header Cache-Control "no-cache";

    # 根路径重定向到公网版首页。必须让浏览器 URL 落在 /monthly-public.html，
    # 这样 M.isPublic() 才能按文件名识别，客户名跳转才会指向 customer-public.html。
    location = / {
        absolute_redirect off;
        return 302 /monthly-public.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
