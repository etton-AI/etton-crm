name: docker-build

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'nginx.conf'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # ★ 若仓库不在 etton-AI 组织下，请把镜像路径改成你的账号，例如 ghcr.io/<你的账号>/etton-crm:latest
          tags: ghcr.io/etton-ai/etton-crm:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
